[project]
name = "precedent"
version = "0.1.0"
description = "Teach your team's agents once, in chat: decisions become tested, versioned rules."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]

[project.scripts]
precedent = "precedent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
